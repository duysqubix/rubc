[package]
name = "rubc-core"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[dependencies]
anyhow = "1.0.79"
chrono = "0.4.33"
fern = { version = "0.6.2", features = ["chrono", "colored"] }
itertools = "0.12.1"
log = "0.4.20"
phf = { version = "0.11.2", features = ["macros"] }
serde = { version = "1.0.196", features = ["rc", "serde_derive"] }
serde_json = "1.0.113"




[features]
# default pays ZERO diagnostic cost: no diag module, no fields, no branches.
default = []
# umbrella gate; sub-features imply it.
diagnostics = []
flight-recorder = ["diagnostics"]
metrics = ["diagnostics"]
trace = ["diagnostics"]
hash = ["diagnostics"]
snapshot = ["diagnostics"]
diag-full = ["diagnostics", "flight-recorder", "metrics", "trace", "hash", "snapshot"]


[dev-dependencies]
serde = { version = "1.0.196", features = ["rc", "serde_derive"] }
serde_json = "1.0.113"
