[package]
name = "rubc-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[dependencies]
anyhow = "1.0"
chrono = "0.4"
itertools = "0.14"
log = { version = "0.4", features = ["std"] }
phf = { version = "0.11", features = ["macros"] }
serde = { version = "1.0", features = ["rc", "serde_derive"] }
serde_json = "1.0"
serde_with = "3.16"




[features]
# default pays ZERO diagnostic cost: no diag module, no fields, no branches.
default = []
# umbrella gate; sub-features imply it.
diagnostics = []
flight-recorder = ["diagnostics"]
metrics = ["diagnostics"]
trace = ["diagnostics"]
hash = ["diagnostics"]
snapshot = ["diagnostics"]
diag-full = ["diagnostics", "flight-recorder", "metrics", "trace", "hash", "snapshot"]


[dev-dependencies]
serde = { version = "1.0", features = ["rc", "serde_derive"] }
serde_json = "1.0"
