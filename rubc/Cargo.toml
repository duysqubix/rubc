[package]
name = "rubc"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.18"
# eframe drives a real native window (winit + wgpu under the hood) and turns
# egui viewport output into OS windows; it re-exports the matching egui. Single
# embedded window for now (Phase 2 adds detachable viewports).
eframe = { version = "0.34", features = ["wgpu"] }
egui = "0.34"
# Pure-Rust image encoders for headless capture (screenshot/gif). Both pull only
# Rust deps (miniz_oxide/fdeflate for PNG, weezl LZW for GIF) -- no C / -sys / FFI.
gif = "0.13"
png = "0.17"
log = "0.4"
rubc-core = { path = "../rubc-core" }
rfd = "0.17.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
