# Cross-platform release binaries for rubc.
#
# Triggered by the vX.Y.Z tag that scripts/release.sh pushes. The script already
# creates the GitHub release (with operator/AI-authored notes); this workflow
# builds the native macOS / Linux / Windows binaries and attaches them to it.
#
#   * ensure-release : safety net — if the release does not exist yet (e.g. a bare
#                      tag push, or the script's `gh release create` failed), it is
#                      created from the annotated tag's notes. No-op otherwise, so
#                      the script's notes are never clobbered.
#   * binaries       : one native build per OS (rust-toolchain.toml pins the
#                      compiler), packaged and uploaded as a release asset.
#
# Manual re-run for an existing tag: Actions → release → Run workflow → enter the tag.

name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to build and attach binaries for
        required: true

permissions:
  contents: write

jobs:
  ensure-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Ensure the release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "$tag" --notes-from-tag

  binaries:
    name: ${{ matrix.target }}
    needs: ensure-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # cpal links ALSA; rfd (file dialogs) links GTK3. Only Linux needs system -dev libs.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libgtk-3-dev

      # No toolchain action: rust-toolchain.toml pins the compiler and rustup
      # installs it on the first cargo call. Each runner builds its native target.
      - name: Build release binary
        run: cargo build --release --locked -p rubc

      - name: Package
        id: package
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          dist="rubc-${tag}-${{ matrix.target }}"
          mkdir "$dist"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/rubc.exe "$dist/"
          else
            cp target/release/rubc "$dist/"
          fi
          cp README.md LICENSE "$dist/" 2>/dev/null || true
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${dist}.zip" "$dist" >/dev/null
            echo "asset=${dist}.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "${dist}.tar.gz" "$dist"
            echo "asset=${dist}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload "$tag" "${{ steps.package.outputs.asset }}" --clobber
