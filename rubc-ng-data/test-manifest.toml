# rubc-ng conformance manifest (W0.5b / bead rubc-4i6p)
#
# Schema:
#   [manifest] documents provenance and the hardware-model universe. "100%" means every
#   applicable entry passes on the listed intended_models, never that one emulator mode passes
#   mutually-exclusive hardware-revision ROMs simultaneously (ADR 0002).
#   [[rom]] entries cover every .gb/.gbc under reference/test-suites exactly once.
#     path: repo-relative ROM path.
#     suite: source suite bucket.
#     intended_models: hardware model IDs targeted by the ROM or ROM+reference pair.
#     current_old_core_status: pass | fail | gated.
#     notes: model-exclusive or gate provenance notes.
#     [rom.expectation]: machine-checkable oracle:
#       kind = mooneye-fibonacci-pass | serial-pass-string | cart-ram-result | pixel-exact | gated-diff | placeholder-skip | model-expectations | vector-count.
#       model-expectations stores per-model sub-expectations when one ROM has DMG-B and CGB-C references.
#   [[vector_suite]] entries cover non-ROM SingleStepTests/sm83 vectors by count.
#   [[known_unwinnable_by_single_model]] records mooneye cases W8 must resolve by model parameterization.

[manifest]
version = 1
bead = "rubc-4i6p"
adr = "docs/adr/0002-rubc-ng-timing-core-rebuild.md"
definition_of_100_percent = "every applicable test ROM passes on the hardware model it targets"
