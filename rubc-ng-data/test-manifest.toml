rom_count = 207
generated_from = ["reference/test-suites", "rubc-core/tests/acid2_test.rs", "rubc-core/tests/mooneye_test.rs", "bd memories rubc-mooneye-85-classification and rubc-cgbc-compat-rebaseline-2026-06-10"]

