[package]
name = "rubc-wasm"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "WebAssembly bindings exposing the rubc-ng Game Boy emulator to JavaScript."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rubc-ng = { path = "../rubc-ng" }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "AudioContext",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioDestinationNode",
]
