[workspace]
members = [ "rubc-core", "rubc", "rubc-wasm"]
# rubc-wasm is a wasm32-only cdylib (web-sys/wasm-bindgen): its cdylib links
# only on wasm32-unknown-unknown. Keep it OUT of default-members so a plain
# native `cargo build` / `cargo test` skips it and never tries a native link.
# Build it explicitly: `cargo build -p rubc-wasm --target wasm32-unknown-unknown`.
default-members = [ "rubc-core", "rubc"]
resolver = "2"

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
