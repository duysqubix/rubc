# Production nginx for rubc.app behind Cloudflare (Full (strict) SSL mode).
#
# Cloudflare terminates TLS at its edge with its own cert, then connects to this
# origin over HTTPS using a Cloudflare ORIGIN certificate (long-lived, trusted
# only by Cloudflare). Generate the cert + key in the Cloudflare dashboard:
#   SSL/TLS -> Origin Server -> Create Certificate
# and mount them at the paths below (see docker-compose.prod.yml).
#
# Recommended Cloudflare settings:
#   SSL/TLS mode: Full (strict)
#   Always Use HTTPS: On
#   Auto Minify / Brotli: optional

# Plain HTTP -> redirect to HTTPS (covers direct hits + CF Flexible fallbacks).
server {
    listen       80;
    listen  [::]:80;
    server_name  rubc.app www.rubc.app;
    return 301 https://$host$request_uri;
}

server {
    listen       443 ssl;
    listen  [::]:443 ssl;
    http2 on;
    server_name  rubc.app www.rubc.app;

    # Cloudflare Origin certificate (mounted from the host in the prod compose).
    ssl_certificate     /etc/nginx/certs/rubc.app.pem;
    ssl_certificate_key /etc/nginx/certs/rubc.app.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Send www -> apex (canonical host).
    if ($host = www.rubc.app) {
        return 301 https://rubc.app$request_uri;
    }

    root   /usr/share/nginx/html;
    index  index.html;

    # Explicit MIME types (override / supplement mime.types).
    types {
        text/html                             html htm;
        text/javascript                       js mjs;
        application/wasm                      wasm;
        text/css                              css;
        image/png                             png;
        image/gif                             gif;
        application/json                      json;
    }

    # Hash-named immutable build assets (JS chunks + the .wasm under
    # /_next/static/media/) can be cached forever.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        location ~* \.wasm$ {
            default_type application/wasm;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # The service worker must never be stale, or clients pin an old app shell.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    gzip            on;
    gzip_types      text/javascript application/javascript text/css application/json;
    gzip_min_length 512;
}
