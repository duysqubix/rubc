# nginx site config for the rubc WebAssembly demo.
#
# The two things that matter for a wasm + ES-module static site:
#   1. `.wasm` must be served as `application/wasm` so the browser can
#      stream-compile it (WebAssembly.instantiateStreaming).
#   2. `.js` must be served as a JS module type; ES `import` from
#      index.js -> pkg/rubc_wasm.js requires a correct JS MIME and http(s).

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Explicit MIME types (override / supplement mime.types).
    types {
        text/html                             html htm;
        text/javascript                       js mjs;
        application/wasm                      wasm;
        text/css                              css;
        image/png                             png;
        image/gif                             gif;
        application/json                      json;
    }

    # Long-cache the generated wasm bundle (content-hashed on rebuild anyway),
    # but always revalidate the HTML entry point.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /pkg/ {
        add_header Cache-Control "public, max-age=3600";
        # Help the browser stream-compile the module.
        location ~* \.wasm$ {
            default_type application/wasm;
            add_header Cache-Control "public, max-age=3600";
        }
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Small gzip win for the JS glue and HTML (wasm is already compact).
    gzip            on;
    gzip_types      text/javascript application/javascript text/css application/json;
    gzip_min_length 512;
}
