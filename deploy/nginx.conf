# nginx site config for the rubc Next.js PWA (static export).
#
# What matters for a wasm + ES-module PWA:
#   1. `.wasm` must be served as `application/wasm` so the browser can
#      stream-compile it (WebAssembly.instantiateStreaming).
#   2. Hash-named build assets under /_next/ can be cached aggressively;
#      the HTML entry, manifest, and service worker must always revalidate.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Explicit MIME types (override / supplement mime.types).
    types {
        text/html                             html htm;
        text/javascript                       js mjs;
        application/wasm                      wasm;
        text/css                              css;
        image/png                             png;
        image/gif                             gif;
        application/json                      json;
    }

    # Hash-named immutable build assets (JS chunks + the .wasm under
    # /_next/static/media/) can be cached forever.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        location ~* \.wasm$ {
            default_type application/wasm;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # The service worker must never be stale, or clients pin an old app shell.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Small gzip win for the JS glue and HTML (wasm is already compact).
    gzip            on;
    gzip_types      text/javascript application/javascript text/css application/json;
    gzip_min_length 512;
}
