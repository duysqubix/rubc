# nginx site config for the rubc Next.js PWA (static export).
#
# What matters for a wasm + ES-module PWA:
#   1. `.wasm` must be served as `application/wasm` so the browser can
#      stream-compile it (WebAssembly.instantiateStreaming).
#   2. Hash-named build assets under /_next/ can be cached aggressively;
#      the HTML entry, manifest, and service worker must always revalidate.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Explicit MIME types (override / supplement mime.types).
    types {
        text/html                             html htm;
        text/javascript                       js mjs;
        application/wasm                      wasm;
        text/css                              css;
        image/png                             png;
        image/gif                             gif;
        application/json                      json;
    }

    # Hash-named immutable build assets (JS chunks + the .wasm under
    # /_next/static/media/) can be cached forever.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        location ~* \.wasm$ {
            default_type application/wasm;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # The service worker must never be stale, or clients pin an old app shell.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # Preloaded, legally-redistributable test ROMs (MIT, (c) 2018 Matt Currie),
    # bundled by `just roms-bundle` into web/public/roms/ -> exported to /roms/.
    # The browser fetches /roms/<file>.gb (+ /roms/manifest.json); the JS reads
    # plain bytes. `gzip_static` transparently serves the pre-built .gz when the
    # client sends Accept-Encoding: gzip. The matching .br files are shipped too,
    # but `brotli_static` needs the ngx_brotli module (NOT in stock nginx:alpine),
    # and Cloudflare already applies brotli on the wire -- so we don't enable it.
    location /roms/ {
        types {
            application/octet-stream  gb gbc;
            application/json          json;
        }
        default_type application/octet-stream;
        gzip_static on;
        # brotli_static on;   # enable ONLY on an nginx built with ngx_brotli.
        add_header Cache-Control "public, max-age=31536000, immutable";

        # The manifest can change when the bundled set changes -> let it revalidate.
        location = /roms/manifest.json {
            add_header Cache-Control "no-cache";
        }
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Small gzip win for the JS glue and HTML (wasm is already compact).
    gzip            on;
    gzip_types      text/javascript application/javascript text/css application/json;
    gzip_min_length 512;
}
